<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ebd7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mascotte">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Mascotte ★ Théodore & Giulia</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5ebd7;
  --bg-soft: #fbf3e1;
  --bg-card: #fff8e8;
  --pink: #d88b9c;
  --pink-deep: #b86a7e;
  --pink-soft: #f5d4dc;
  --gold: #ffc857;
  --gold-glow: #ffe28a;
  --gold-deep: #e89c1a;
  --green: #7fb069;
  --text: #5a4842;
  --text-soft: #8a7670;
  --text-faint: #b8a89e;
  --shadow: rgba(120, 90, 60, 0.18);
  --shadow-soft: rgba(120, 90, 60, 0.08);
}
html, body { height: 100%; }
body {
  font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}
.cursive { font-family: 'Caveat', cursive; }

.container { max-width: 760px; margin: 0 auto; padding: 16px; }

/* Profile select */
.profile-select { text-align: center; padding-top: 24px; }
.profile-select h1 { font-family: 'Caveat', cursive; font-weight: 700; color: var(--pink); font-size: 56px; line-height: 1; margin-bottom: 4px; }
.profile-select .sub { color: var(--text-soft); font-size: 16px; margin-bottom: 28px; }
.profiles { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.profile-card {
  background: var(--bg-card);
  border: 2px solid var(--pink-soft);
  border-radius: 28px;
  padding: 18px 14px 16px;
  width: 168px;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  box-shadow: 0 4px 14px var(--shadow-soft);
}
.profile-card:active { transform: scale(0.96); }
.profile-card:hover { border-color: var(--pink); box-shadow: 0 8px 24px var(--shadow); }
.profile-card .pic-wrap {
  width: 130px; height: 160px; margin: 0 auto;
  display: flex; align-items: flex-end; justify-content: center;
}
.profile-card img { width: 130px; height: auto; max-height: 160px; object-fit: contain; }
.profile-card h2 { font-family: 'Caveat', cursive; font-weight: 700; color: var(--pink); font-size: 32px; margin-top: 8px; }
.profile-card .pts { color: var(--text-soft); font-size: 13px; margin-top: 2px; font-weight: 500; }
.profile-card .pts b { color: var(--gold-deep); font-weight: 700; }
.parent-btn { background: transparent; border: 1px solid var(--text-faint); color: var(--text-soft); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit; margin-top: 28px; }
.parent-btn:active { transform: scale(0.96); }

/* Main */
.main { display: none; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.icon-btn { background: var(--bg-card); border: 1px solid var(--pink-soft); color: var(--text-soft); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.icon-btn:active { transform: scale(0.92); }
.kid-name { font-family: 'Caveat', cursive; font-weight: 700; color: var(--pink); font-size: 42px; line-height: 1; }
.kid-name .heart { color: var(--pink-soft); margin: 0 6px; }

.day-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-soft);
  margin-bottom: 12px; padding: 0 4px;
}
.day-bar .date { color: var(--pink); font-weight: 600; text-transform: capitalize; }

/* Mascot */
.mascot-zone { text-align: center; margin: 6px 0 18px; }
.mascot-img {
  width: 150px; height: auto; max-height: 200px;
  object-fit: contain;
  filter: drop-shadow(0 8px 14px var(--shadow));
  transition: transform 0.3s;
}
.mascot-img.bounce { animation: bounce 0.7s; }
@keyframes bounce {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-10px) rotate(-4deg); }
  50% { transform: translateY(-16px) rotate(0); }
  75% { transform: translateY(-6px) rotate(4deg); }
}

/* Day progress */
.day-progress {
  background: var(--bg-card);
  border: 1px solid var(--pink-soft);
  border-radius: 20px;
  padding: 12px 16px;
  margin-bottom: 16px;
  text-align: center;
  box-shadow: 0 2px 8px var(--shadow-soft);
}
.day-progress .num { font-size: 24px; color: var(--gold-deep); font-weight: 700; line-height: 1; }
.day-progress .num .total { color: var(--text-faint); font-weight: 600; }
.day-progress .label { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

/* Routine blocks */
.routine {
  background: var(--bg-card);
  border: 1px solid var(--pink-soft);
  border-radius: 22px;
  padding: 14px 12px 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 10px var(--shadow-soft);
}
.routine-title {
  display: flex; align-items: center; gap: 8px;
  color: var(--pink-deep);
  font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px;
  margin-bottom: 12px; padding-left: 4px;
  line-height: 1;
}
.routine-title .emoji { font-size: 22px; }
.tasks-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
@media (max-width: 600px) {
  .tasks-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}

/* Task light */
.task {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer;
  padding: 6px 2px;
  border-radius: 14px;
  transition: background 0.2s;
}
.task:active { background: rgba(216, 139, 156, 0.08); }
.task .icon-emoji { font-size: 30px; line-height: 1; }
.task .label { font-size: 10.5px; color: var(--text-soft); text-align: center; line-height: 1.15; min-height: 24px; max-width: 90px; }
.task .light {
  width: 50px; height: 50px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #faecc8 0%, #d6bd92 55%, #a4885f 100%);
  box-shadow: inset 0 -4px 7px rgba(0,0,0,0.18), inset 0 2px 3px rgba(255,255,255,0.6), 0 2px 5px var(--shadow);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.15s, box-shadow 0.3s;
}
.task .light::before {
  content: ''; position: absolute; inset: 5px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0) 50%);
  pointer-events: none;
}
.task:active .light { transform: scale(0.92); }
.task.on .light {
  background: radial-gradient(circle at 32% 28%, #fffacc 0%, #ffd862 45%, #f0a818 100%);
  box-shadow: 0 0 24px rgba(255,213,74,0.7), 0 0 44px rgba(255,213,74,0.32), inset 0 -3px 6px rgba(220,140,20,0.45), inset 0 2px 4px rgba(255,255,255,0.6);
  animation: glow 2.4s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 20px rgba(255,213,74,0.6), 0 0 38px rgba(255,213,74,0.25), inset 0 -3px 6px rgba(220,140,20,0.45), inset 0 2px 4px rgba(255,255,255,0.6); }
  50%      { box-shadow: 0 0 30px rgba(255,213,74,0.9), 0 0 60px rgba(255,213,74,0.42), inset 0 -3px 6px rgba(220,140,20,0.45), inset 0 2px 4px rgba(255,255,255,0.6); }
}
.task .light .star {
  font-size: 22px; line-height: 1;
  opacity: 0; transform: scale(0) rotate(-180deg);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 1px 2px rgba(180,100,10,0.5));
  position: relative; z-index: 1;
}
.task.on .light .star { opacity: 1; transform: scale(1) rotate(0); }

/* Week strip */
.week-strip {
  background: var(--bg-card);
  border: 1px solid var(--pink-soft);
  border-radius: 18px;
  padding: 12px 14px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px var(--shadow-soft);
}
.week-strip .title { font-size: 12px; color: var(--text-soft); text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.week-stars-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day-cell {
  aspect-ratio: 1; border-radius: 12px;
  background: var(--bg-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text-faint);
}
.day-cell .star-mark { font-size: 18px; opacity: 0.18; transition: all 0.3s; line-height: 1; }
.day-cell.full .star-mark { opacity: 1; color: var(--gold-deep); filter: drop-shadow(0 0 6px var(--gold-glow)); }
.day-cell.partial .star-mark { opacity: 0.55; color: var(--gold); }
.day-cell.today { box-shadow: 0 0 0 2px var(--pink); }
.day-cell .day-label { font-weight: 600; margin-top: 1px; color: var(--text-soft); }

/* Milestone */
.milestone { background: linear-gradient(135deg, var(--pink-soft), var(--bg-card)); border: 1px dashed var(--pink); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; text-align: center; font-size: 13px; color: var(--text-soft); }
.milestone .big { color: var(--pink-deep); font-weight: 700; font-size: 16px; }

/* Burst */
.burst { position: fixed; pointer-events: none; z-index: 100; font-size: 36px; animation: burst 0.9s ease-out forwards; filter: drop-shadow(0 2px 4px var(--shadow)); }
@keyframes burst {
  0% { transform: scale(0.4) translateY(0); opacity: 1; }
  100% { transform: scale(1.6) translateY(-90px); opacity: 0; }
}

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(90,72,66,0.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.show { display: flex; }
.modal { background: var(--bg-card); border-radius: 24px; padding: 22px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(60,40,30,0.3); }
.modal h3 { font-family: 'Caveat', cursive; font-weight: 700; color: var(--pink-deep); font-size: 30px; margin-bottom: 12px; line-height: 1; }
.modal .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--pink-soft); font-size: 13px; }
.modal .row:last-child { border-bottom: 0; }
.modal button { background: var(--pink); color: white; border: none; padding: 11px 16px; border-radius: 14px; cursor: pointer; margin-top: 12px; width: 100%; font-size: 14px; font-family: inherit; font-weight: 600; }
.modal button:active { transform: scale(0.97); }
.modal .danger { background: #d97070; }
.modal .neutral { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--text-faint); }
.modal .test { background: var(--gold); color: var(--text); }
.modal .section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--pink-soft); }
.modal .section-title { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
.modal .btn-row { display: flex; gap: 8px; }
.modal .btn-row button { flex: 1; }

/* Reward */
.reward-overlay { display: none; position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,228,150,0.95), rgba(245,235,215,0.97)); z-index: 300; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
.reward-overlay.show { display: flex; animation: fadeIn 0.4s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.reward-overlay h2 { font-family: 'Caveat', cursive; font-weight: 700; color: var(--pink-deep); font-size: 56px; line-height: 1; margin-bottom: 14px; text-align: center; }
.reward-overlay p { color: var(--text); text-align: center; max-width: 400px; margin-bottom: 22px; padding: 0 12px; font-size: 17px; line-height: 1.4; }
.reward-overlay img { width: 180px; height: auto; animation: bounce 1s infinite; filter: drop-shadow(0 10px 18px rgba(120,90,60,0.25)); }
.reward-overlay button { background: var(--pink); color: white; font-weight: 700; border: none; padding: 14px 32px; border-radius: 16px; cursor: pointer; font-size: 17px; font-family: inherit; box-shadow: 0 6px 18px rgba(184,106,126,0.4); }
.reward-overlay button:active { transform: scale(0.97); }

@media (max-width: 380px) {
  .profile-card { width: 145px; }
  .profile-card .pic-wrap, .profile-card img { width: 110px; height: auto; max-height: 140px; }
  .mascot-img { width: 130px; }
}
</style>
</head>
<body>
<div class="container">

  <!-- Profile select -->
  <div class="profile-select" id="profileScreen">
    <h1>Bienvenue</h1>
    <p class="sub">Qui es-tu ?</p>
    <div class="profiles">
      <div class="profile-card" onclick="selectKid('theo')">
        <div class="pic-wrap"><img src="theo.jpg" alt="Théodore"></div>
        <h2>·Théodore·</h2>
        <div class="pts"><b id="ptsTheo">0</b> jours ★</div>
      </div>
      <div class="profile-card" onclick="selectKid('giulia')">
        <div class="pic-wrap"><img src="giulia.jpg" alt="Giulia"></div>
        <h2>·Giulia·</h2>
        <div class="pts"><b id="ptsGiulia">0</b> jours ★</div>
      </div>
    </div>
    <button class="parent-btn" onclick="openParent()">⚙ Espace parent</button>
  </div>

  <!-- Main screen -->
  <div class="main" id="mainScreen">
    <div class="header">
      <button class="icon-btn" onclick="goBack()">←</button>
      <div class="kid-name"><span class="heart">·</span><span id="kidName"></span><span class="heart">·</span></div>
      <button class="icon-btn" onclick="openParent()">⚙</button>
    </div>

    <div class="day-bar">
      <span>Aujourd'hui</span>
      <span class="date" id="dateLabel"></span>
    </div>

    <div class="mascot-zone">
      <img src="theo.jpg" class="mascot-img" id="mascot" alt="mascotte">
    </div>

    <div class="day-progress">
      <div class="num"><span id="todayCount">0</span><span class="total">/<span id="todayTotal">12</span></span> ★</div>
      <div class="label">Étoiles d'aujourd'hui</div>
    </div>

    <div class="routine">
      <div class="routine-title"><span class="emoji">☀️</span> Le matin</div>
      <div class="tasks-grid" id="morningGrid"></div>
    </div>

    <div class="routine">
      <div class="routine-title"><span class="emoji">🌙</span> Le soir</div>
      <div class="tasks-grid" id="eveningGrid"></div>
    </div>

    <div class="week-strip">
      <div class="title">Ma semaine</div>
      <div class="week-stars-grid" id="weekGrid"></div>
    </div>

    <div class="milestone">
      <div class="big" id="milestoneText">🎁 Cadeau dans <span id="daysLeft">180</span> jours</div>
      <div><span id="totalDays">0</span> jours d'étoiles déjà</div>
    </div>
  </div>

</div>

<!-- Parent modal -->
<div class="modal-bg" id="parentModal">
  <div class="modal">
    <h3>Espace parent</h3>
    <div id="parentStats"></div>
    <div class="section">
      <div class="section-title">Mode test (avancer le temps)</div>
      <div class="btn-row">
        <button class="test" onclick="advanceDay(1)">+1 jour ⏩</button>
        <button class="test" onclick="advanceDay(7)">+7 jours ⏩</button>
      </div>
      <button class="neutral" onclick="resetSimDate()">Revenir à aujourd'hui</button>
    </div>
    <div class="section">
      <div class="section-title">Reset</div>
      <button class="danger" onclick="resetAll()">Tout effacer</button>
    </div>
    <button class="neutral" onclick="closeParent()">Fermer</button>
  </div>
</div>

<!-- Reward overlay -->
<div class="reward-overlay" id="rewardOverlay">
  <img src="theo.jpg" id="rewardMascot" alt="">
  <h2 id="rewardTitle">🎉 Bravo ! 🎉</h2>
  <p id="rewardText"></p>
  <button onclick="closeReward()">Génial !</button>
</div>

<script>
const TASKS = {
  morning: [
    { id: 'lit',      icon: '🛏️', label: "Faire son lit" },
    { id: 'habit',    icon: '👕', label: "S'habiller" },
    { id: 'dents_m',  icon: '🪥', label: "Brosser les dents" },
    { id: 'petitdej', icon: '🥣', label: "Petit déj" },
    { id: 'bonjour',  icon: '👋', label: "Dire bonjour" },
    { id: 'ecole',    icon: '🎒', label: "Aller à l'école" }
  ],
  evening: [
    { id: 'diner',    icon: '🍽️', label: "Dîner" },
    { id: 'ranger',   icon: '🧸', label: "Ranger" },
    { id: 'dents_s',  icon: '🪥', label: "Brosser les dents" },
    { id: 'bain',     icon: '🛁', label: "Bain" },
    { id: 'pyjama',   icon: '🌙', label: "Pyjama" },
    { id: 'dodo',     icon: '📖', label: "Histoire et dodo" }
  ]
};
const ALL_TASKS = [...TASKS.morning, ...TASKS.evening];
const DAY_GOAL_COUNT = 9; // 9 sur 12 = jour réussi
const KIDS = ['theo', 'giulia'];
const KID_NAMES = { theo: 'Théodore', giulia: 'Giulia' };
const KID_IMAGES = { theo: 'theo.jpg', giulia: 'giulia.jpg' };
const STORAGE_KEY = 'mascotte_v3';

let state;
state = loadState();
let currentKid = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.theo && s.giulia) return s;
    }
  } catch (e) {}
  return {
    theo:   { tasks: {}, startDate: todayISO(0), rewardedKeys: [] },
    giulia: { tasks: {}, startDate: todayISO(0), rewardedKeys: [] },
    simOffset: 0
  };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function todayISO(forceOffset) {
  const d = new Date();
  const off = (typeof forceOffset === 'number') ? forceOffset : ((state && state.simOffset) || 0);
  d.setDate(d.getDate() + off);
  return d.toISOString().slice(0, 10);
}
function today() { return todayISO(); }
function todayDate() {
  const d = new Date();
  d.setDate(d.getDate() + ((state && state.simOffset) || 0));
  return d;
}
function fmtDate(iso) {
  const d = new Date(iso);
  const days = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
  const months = ['janv', 'févr', 'mars', 'avril', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function dayKey(kid) { return state[kid].tasks[today()] || {}; }

function dayTaskCount(kid, dateStr) {
  const day = state[kid].tasks[dateStr];
  if (!day) return 0;
  return Object.values(day).filter(v => v).length;
}
function isDayFull(kid, dateStr)    { return dayTaskCount(kid, dateStr) >= DAY_GOAL_COUNT; }
function isDayPartial(kid, dateStr) { const c = dayTaskCount(kid, dateStr); return c > 0 && !isDayFull(kid, dateStr); }
function totalSuccessfulDays(kid) {
  let n = 0;
  Object.keys(state[kid].tasks).forEach(d => { if (isDayFull(kid, d)) n++; });
  return n;
}
function mondayOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  if (day !== 1) d.setDate(d.getDate() - (day - 1));
  return d;
}

function refreshProfileScreen() {
  document.getElementById('ptsTheo').textContent   = totalSuccessfulDays('theo');
  document.getElementById('ptsGiulia').textContent = totalSuccessfulDays('giulia');
}

function selectKid(kid) {
  currentKid = kid;
  document.getElementById('profileScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('kidName').textContent = KID_NAMES[kid];
  const img = KID_IMAGES[kid];
  document.getElementById('mascot').src = img;
  document.getElementById('rewardMascot').src = img;
  buildTaskGrids();
  refreshAll();
  window.scrollTo(0, 0);
}

function goBack() {
  currentKid = null;
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('profileScreen').style.display = 'block';
  refreshProfileScreen();
}

function buildTaskGrids() {
  const m = document.getElementById('morningGrid');
  const e = document.getElementById('eveningGrid');
  m.innerHTML = ''; e.innerHTML = '';
  TASKS.morning.forEach(t => m.appendChild(makeTaskEl(t)));
  TASKS.evening.forEach(t => e.appendChild(makeTaskEl(t)));
}
function makeTaskEl(t) {
  const el = document.createElement('div');
  el.className = 'task';
  el.dataset.id = t.id;
  el.innerHTML = `
    <span class="icon-emoji">${t.icon}</span>
    <span class="label">${t.label}</span>
    <span class="light"><span class="star">⭐</span></span>
  `;
  el.addEventListener('click', () => toggleTask(t.id, el));
  return el;
}

function refreshAll() {
  document.getElementById('dateLabel').textContent = fmtDate(today());
  syncTaskStates();
  renderDayProgress();
  renderWeek();
  renderMilestone();
}

function syncTaskStates() {
  const day = dayKey(currentKid);
  document.querySelectorAll('.task').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('on', !!day[id]);
  });
}

function toggleTask(id, el) {
  const d = today();
  if (!state[currentKid].tasks[d]) state[currentKid].tasks[d] = {};
  const wasOn = state[currentKid].tasks[d][id];
  state[currentKid].tasks[d][id] = !wasOn;
  saveState();
  if (!wasOn) {
    el.classList.add('on');
    burstAt(el);
    bounceMascot();
    setTimeout(() => { renderDayProgress(); renderWeek(); renderMilestone(); checkRewards(); }, 200);
  } else {
    el.classList.remove('on');
    renderDayProgress(); renderWeek(); renderMilestone();
  }
}

function burstAt(el) {
  const r = el.getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'burst';
  b.textContent = '⭐';
  b.style.left = (r.left + r.width / 2 - 18) + 'px';
  b.style.top  = (r.top  + r.height / 2 - 18) + 'px';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 950);
}
function bounceMascot() {
  const m = document.getElementById('mascot');
  m.classList.remove('bounce'); void m.offsetWidth; m.classList.add('bounce');
}

function renderDayProgress() {
  const c = dayTaskCount(currentKid, today());
  document.getElementById('todayCount').textContent = c;
  document.getElementById('todayTotal').textContent = ALL_TASKS.length;
}

function renderWeek() {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  const monday = mondayOfWeek(todayDate());
  const todayStr = today();
  const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (key === todayStr) cell.classList.add('today');
    if (isDayFull(currentKid, key)) cell.classList.add('full');
    else if (isDayPartial(currentKid, key)) cell.classList.add('partial');
    cell.innerHTML = `<span class="star-mark">★</span><span class="day-label">${dayNames[i]}</span>`;
    grid.appendChild(cell);
  }
}

function renderMilestone() {
  const startDate = new Date(state[currentKid].startDate);
  const daysSince = Math.floor((todayDate() - startDate) / (1000 * 60 * 60 * 24));
  const daysLeft = Math.max(0, 180 - daysSince);
  document.getElementById('totalDays').textContent = totalSuccessfulDays(currentKid);
  if (daysLeft === 0) {
    document.getElementById('milestoneText').innerHTML = '🎁 GROS CADEAU DÉBLOQUÉ ! 🎁';
  } else {
    document.getElementById('milestoneText').innerHTML = '🎁 Cadeau dans <span id="daysLeft">' + daysLeft + '</span> jours';
  }
}

function checkRewards() {
  const todayStr = today();
  if (isDayFull(currentKid, todayStr)) {
    const k = 'day_' + todayStr;
    if (!state[currentKid].rewardedKeys.includes(k)) {
      state[currentKid].rewardedKeys.push(k);
      saveState();
      showReward('Jour réussi !', 'Tu as eu ton étoile du jour ⭐');
    }
  }
  // Récompense semaine : 5 jours full sur la semaine courante
  const monday = mondayOfWeek(todayDate());
  let fullDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(d.getDate() + i);
    if (isDayFull(currentKid, d.toISOString().slice(0, 10))) fullDays++;
  }
  const weekKey = 'week_' + monday.toISOString().slice(0, 10);
  if (fullDays >= 5 && !state[currentKid].rewardedKeys.includes(weekKey)) {
    state[currentKid].rewardedKeys.push(weekKey);
    saveState();
    setTimeout(() => {
      showReward('Super semaine !', "5 étoiles cette semaine ! Tu as gagné une image personnalisée de ta peluche. Demande à Papa.");
    }, 700);
  }
}

function showReward(title, text) {
  document.getElementById('rewardTitle').textContent = title;
  document.getElementById('rewardText').textContent = text;
  document.getElementById('rewardOverlay').classList.add('show');
}
function closeReward() { document.getElementById('rewardOverlay').classList.remove('show'); }

function openParent() {
  const stats = document.getElementById('parentStats');
  let html = '';
  KIDS.forEach(k => {
    const tot = totalSuccessfulDays(k);
    const startDate = new Date(state[k].startDate);
    const daysSince = Math.floor((todayDate() - startDate) / (1000 * 60 * 60 * 24));
    const todayC = dayTaskCount(k, today());
    html += `<div class="row"><strong>${KID_NAMES[k]}</strong><span>${todayC}/${ALL_TASKS.length} aujourd'hui · ${tot} jours ★ · ${daysSince}/180j</span></div>`;
  });
  if (state.simOffset) {
    html += `<div class="row" style="color:var(--gold-deep)"><strong>⏩ Mode test</strong><span>+${state.simOffset} jours</span></div>`;
  }
  stats.innerHTML = html;
  document.getElementById('parentModal').classList.add('show');
}
function closeParent() { document.getElementById('parentModal').classList.remove('show'); }

function advanceDay(n) {
  state.simOffset = (state.simOffset || 0) + n;
  saveState();
  closeParent();
  if (currentKid) refreshAll(); else refreshProfileScreen();
}
function resetSimDate() {
  state.simOffset = 0;
  saveState();
  closeParent();
  if (currentKid) refreshAll();
}
function resetAll() {
  if (!confirm('Tout effacer (historique, étoiles) ?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadState();
  saveState();
  closeParent();
  goBack();
}

refreshProfileScreen();
</script>
</body>
</html>
