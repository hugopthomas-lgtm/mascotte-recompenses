<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mascotte">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<title>Mascotte ★ Théodore & Giulia</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1530;
  --bg2: #2a1f4a;
  --purple: #7b5fc7;
  --purple-light: #a487e8;
  --gold: #ffd54a;
  --gold-glow: #ffe082;
  --pink: #ff8fb1;
  --green: #6dd47e;
  --text: #f4eeff;
  --text-dim: #b8a9d9;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 70%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.star { position: absolute; background: white; border-radius: 50%; opacity: 0.6; animation: twinkle 3s infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }

.container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

/* Profile select */
.profile-select { text-align: center; padding-top: 40px; }
.profile-select h1 { font-size: 28px; margin-bottom: 10px; color: var(--gold); }
.profile-select .sub { color: var(--text-dim); margin-bottom: 30px; }
.profiles { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.profile-card {
  background: linear-gradient(135deg, rgba(123,95,199,0.3), rgba(123,95,199,0.1));
  border: 2px solid var(--purple);
  border-radius: 24px;
  padding: 24px;
  width: 180px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.profile-card:active { transform: scale(0.95); }
.profile-card:hover { box-shadow: 0 0 30px rgba(164,135,232,0.4); }
.profile-card img { width: 120px; height: 120px; object-fit: contain; }
.profile-card h2 { margin-top: 10px; font-size: 22px; }
.profile-card .pts { color: var(--gold); font-size: 14px; margin-top: 4px; }

/* Main */
.main { display: none; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.back-btn { background: rgba(255,255,255,0.1); border: none; color: var(--text); padding: 8px 14px; border-radius: 12px; font-size: 14px; cursor: pointer; }
.kid-name { font-size: 22px; color: var(--gold); }
.parent-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-dim); padding: 6px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }

/* Day indicator */
.day-bar {
  background: rgba(255,255,255,0.05);
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.day-bar .label { color: var(--text-dim); }
.day-bar .date { color: var(--gold); font-weight: bold; }

/* Mascot */
.mascot-zone { text-align: center; position: relative; margin: 10px 0 20px; }
.mascot-img {
  width: 200px;
  height: 200px;
  object-fit: contain;
  filter: drop-shadow(0 0 30px rgba(164,135,232,0.5));
  transition: transform 0.3s;
}
.mascot-img.bounce { animation: bounce 0.6s; }
@keyframes bounce {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.15) rotate(-5deg); }
  60% { transform: scale(1.1) rotate(5deg); }
}

/* Day progress */
.day-progress {
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 14px;
  text-align: center;
}
.day-progress .title { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
.day-progress .num { font-size: 22px; color: var(--gold); font-weight: bold; margin-bottom: 8px; }
.day-bar-track { height: 14px; background: rgba(0,0,0,0.3); border-radius: 7px; overflow: hidden; }
.day-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple-light), var(--gold));
  border-radius: 7px;
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 12px rgba(255,213,74,0.5);
}

/* Week of stars */
.week-row {
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 14px;
}
.week-row .title { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 10px; }
.week-stars-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-cell {
  aspect-ratio: 1;
  border-radius: 10px;
  background: rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--text-dim);
  position: relative;
}
.day-cell .star-mark { font-size: 18px; opacity: 0.2; transition: all 0.3s; }
.day-cell.full .star-mark { opacity: 1; filter: drop-shadow(0 0 6px var(--gold)); }
.day-cell.partial .star-mark { opacity: 0.6; }
.day-cell.today { border: 2px solid var(--gold); }
.day-cell .day-label { font-weight: bold; margin-top: 2px; }

/* Milestone */
.milestone { background: linear-gradient(135deg, rgba(255,143,177,0.15), rgba(255,213,74,0.15)); border: 1px dashed var(--pink); border-radius: 16px; padding: 12px; margin-bottom: 20px; text-align: center; font-size: 13px; color: var(--text-dim); }
.milestone .big { color: var(--pink); font-weight: bold; font-size: 16px; }

/* Tasks */
.tasks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.task {
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.task:active { transform: scale(0.95); }
.task.done {
  background: linear-gradient(135deg, rgba(109,212,126,0.25), rgba(109,212,126,0.1));
  border-color: var(--green);
}
.task .icon { font-size: 36px; display: block; margin-bottom: 6px; }
.task .label { font-size: 13px; color: var(--text); line-height: 1.3; }
.task .check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--green);
  color: white;
  font-size: 14px;
  display: none;
  align-items: center;
  justify-content: center;
}
.task.done .check { display: flex; }

/* Burst */
.burst { position: fixed; pointer-events: none; z-index: 100; font-size: 40px; animation: burst 1s ease-out forwards; }
@keyframes burst {
  0% { transform: scale(0.5) translateY(0); opacity: 1; }
  100% { transform: scale(1.5) translateY(-100px); opacity: 0; }
}

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.show { display: flex; }
.modal { background: var(--bg2); border-radius: 20px; padding: 24px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; color: var(--gold); }
.modal .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
.modal button { background: var(--purple); color: white; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; margin-top: 12px; width: 100%; font-size: 14px; }
.modal .danger { background: rgba(255,80,80,0.4); }
.modal .test { background: rgba(255,213,74,0.3); color: var(--gold); }
.modal .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
.modal .section-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

/* Reward */
.reward-overlay { display: none; position: fixed; inset: 0; background: radial-gradient(circle, rgba(255,213,74,0.3), rgba(0,0,0,0.9)); z-index: 300; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
.reward-overlay.show { display: flex; animation: fadeIn 0.4s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.reward-overlay h2 { color: var(--gold); font-size: 32px; margin-bottom: 12px; text-align: center; }
.reward-overlay p { color: var(--text); text-align: center; max-width: 400px; margin-bottom: 20px; padding: 0 20px; }
.reward-overlay img { width: 180px; animation: bounce 1s infinite; }
.reward-overlay button { background: var(--gold); color: var(--bg); font-weight: bold; border: none; padding: 14px 28px; border-radius: 14px; cursor: pointer; font-size: 16px; }

@media (max-width: 500px) {
  .mascot-img { width: 150px; height: 150px; }
  .profile-card { width: 140px; }
  .profile-card img { width: 90px; height: 90px; }
}
</style>
</head>

  <h2 id="rewardTitle">🎉 BRAVO ! 🎉</h2>
  <p id="rewardText"></p>
  <button onclick="closeReward()">Génial !</button>
</div>

<script>
const TASKS = [
  { id: 'matin',   icon: '👕', label: "S'habiller le matin" },
  { id: 'dents_m', icon: '🪥', label: "Brosser les dents (matin)" },
  { id: 'sortir',  icon: '🚪', label: "Se préparer pour sortir" },
  { id: 'manger',  icon: '🍽', label: "Manger sans rechigner" },
  { id: 'ranger',  icon: '🧸', label: "Ranger les jouets" },
  { id: 'pyjama',  icon: '🌙', label: "Mettre le pyjama" },
  { id: 'dents_s', icon: '🪥', label: "Brosser les dents (soir)" }
];
const DAY_GOAL_RATIO = 0.7; // 70% des tâches faites = "jour réussi"
const KIDS = ['theo', 'giulia'];
const STORAGE_KEY = 'mascotte_v2';

let state;
state = loadState();
let currentKid = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    theo:   { tasks: {}, startDate: today(), rewardedWeeks: [] },
    giulia: { tasks: {}, startDate: today(), rewardedWeeks: [] },
    simOffset: 0  // décalage en jours pour les tests
  };
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function today() {
  const d = new Date();
  const off = state ? (state.simOffset || 0) : 0;
  d.setDate(d.getDate() + off);
  return d.toISOString().slice(0,10);
}
function todayDate() {
  const d = new Date();
  d.setDate(d.getDate() + (state.simOffset || 0));
  return d;
}
function dayKey(kid) {
  return state[kid].tasks[today()] || {};
}
function fmtDate(iso) {
  const d = new Date(iso);
  const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months = ['janv','févr','mars','avril','mai','juin','juil','août','sept','oct','nov','déc'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function buildStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    const sz = Math.random()*3 + 1;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.animationDelay = Math.random()*3 + 's';
    c.appendChild(s);
  }
}
buildStars();

// Combien de tâches faites un jour donné
function dayTaskCount(kid, dateStr) {
  const day = state[kid].tasks[dateStr];
  if (!day) return 0;
  return Object.values(day).filter(v => v).length;
}

// Un jour est "réussi" si on a fait au moins DAY_GOAL_RATIO des tâches
function isDayFull(kid, dateStr) {
  return dayTaskCount(kid, dateStr) >= Math.ceil(TASKS.length * DAY_GOAL_RATIO);
}
function isDayPartial(kid, dateStr) {
  const c = dayTaskCount(kid, dateStr);
  return c > 0 && !isDayFull(kid, dateStr);
}

function totalSuccessfulDays(kid) {
  let n = 0;
  Object.keys(state[kid].tasks).forEach(d => { if (isDayFull(kid, d)) n++; });
  return n;
}

// Lundi de la semaine courante (dans le temps simulé)
function mondayOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  if (day !== 1) d.setDate(d.getDate() - (day - 1));
  return d;
}

function refreshProfileScreen() {
  document.getElementById('ptsTheo').textContent   = totalSuccessfulDays('theo')   + ' jours ★';
  document.getElementById('ptsGiulia').textContent = totalSuccessfulDays('giulia') + ' jours ★';
}

function selectKid(kid) {
  currentKid = kid;
  document.getElementById('profileScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('kidName').textContent = kid === 'theo' ? 'Théodore' : 'Giulia';
  refreshAll();
}

function goBack() {
  currentKid = null;
  document.getElementById('profileScreen').style.display = 'block';
  document.getElementById('mainScreen').style.display = 'none';
  refreshProfileScreen();
}

function refreshAll() {
  document.getElementById('dateLabel').textContent = fmtDate(today());
  renderTasks();
  renderDayProgress();
  renderWeek();
  renderMilestone();
}

function renderTasks() {
  const container = document.getElementById('tasks');
  container.innerHTML = '';
  const day = dayKey(currentKid);
  TASKS.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task' + (day[t.id] ? ' done' : '');
    el.innerHTML = `<span class="icon">${t.icon}</span><span class="label">${t.label}</span><span class="check">✓</span>`;
    el.onclick = () => toggleTask(t.id, el);
    container.appendChild(el);
  });
}

function toggleTask(id, el) {
  const day = today();
  if (!state[currentKid].tasks[day]) state[currentKid].tasks[day] = {};
  const wasDone = state[currentKid].tasks[day][id];
  state[currentKid].tasks[day][id] = !wasDone;
  saveState();
  if (!wasDone) {
    el.classList.add('done');
    burstAt(el);
    bounceMascot();
    setTimeout(() => {
      renderDayProgress();
      renderWeek();
      renderMilestone();
      checkRewards();
    }, 250);
  } else {
    el.classList.remove('done');
    renderDayProgress();
    renderWeek();
    renderMilestone();
  }
}

function burstAt(el) {
  const r = el.getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'burst';
  b.textContent = '⭐';
  b.style.left = (r.left + r.width/2 - 20) + 'px';
  b.style.top = (r.top + r.height/2 - 20) + 'px';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1000);
}

function bounceMascot() {
  const m = document.getElementById('mascot');
  m.classList.remove('bounce');
  void m.offsetWidth;
  m.classList.add('bounce');
}

function renderDayProgress() {
  const count = dayTaskCount(currentKid, today());
  const total = TASKS.length;
  document.getElementById('todayCount').textContent = count;
  document.getElementById('todayTotal').textContent = total;
  document.getElementById('todayFill').style.width = Math.min(100, (count/total)*100) + '%';
}

function renderWeek() {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  const monday = mondayOfWeek(todayDate());
  const todayStr = today();
  const dayNames = ['L','M','M','J','V','S','D'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0,10);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (key === todayStr) cell.classList.add('today');
    if (isDayFull(currentKid, key)) cell.classList.add('full');
    else if (isDayPartial(currentKid, key)) cell.classList.add('partial');
    cell.innerHTML = `<span class="star-mark">★</span><span class="day-label">${dayNames[i]}</span>`;
    grid.appendChild(cell);
  }
}

function renderMilestone() {
  const startDate = new Date(state[currentKid].startDate);
  const daysSince = Math.floor((todayDate() - startDate)/(1000*60*60*24));
  const daysLeft = Math.max(0, 180 - daysSince);
  document.getElementById('daysLeft').textContent = daysLeft;
  document.getElementById('totalDays').textContent = totalSuccessfulDays(currentKid);
  if (daysLeft === 0) {
    document.getElementById('milestoneText').innerHTML = '🎁 GROS CADEAU DÉBLOQUÉ ! 🎁';
  } else {
    document.getElementById('milestoneText').innerHTML = '🎁 Cadeau dans <span id="daysLeft">'+daysLeft+'</span> jours';
  }
}

function checkRewards() {
  // Récompense quand le jour passe en "full"
  if (isDayFull(currentKid, today())) {
    const k = 'day_' + today();
    if (!state[currentKid].rewardedWeeks.includes(k)) {
      state[currentKid].rewardedWeeks.push(k);
      saveState();
      showReward('⭐ JOUR RÉUSSI ! ⭐', 'Tu as gagné ton étoile du jour !');
    }
  }
  // Récompense semaine : 5 jours full sur la semaine courante
  const monday = mondayOfWeek(todayDate());
  let fullDaysThisWeek = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0,10);
    if (isDayFull(currentKid, key)) fullDaysThisWeek++;
  }
  const weekKey = 'week_' + monday.toISOString().slice(0,10);
  if (fullDaysThisWeek >= 5 && !state[currentKid].rewardedWeeks.includes(weekKey)) {
    state[currentKid].rewardedWeeks.push(weekKey);
    saveState();
    setTimeout(() => {
      showReward('🎉 SUPER SEMAINE ! 🎉', 'Tu as eu 5 étoiles cette semaine ! Tu as gagné une image personnalisée de ta peluche. Demande à Papa.');
    }, 600);
  }
}

function showReward(title, text) {
  document.getElementById('rewardTitle').textContent = title;
  document.getElementById('rewardText').textContent = text;
  document.getElementById('rewardOverlay').classList.add('show');
}
function closeReward() {
  document.getElementById('rewardOverlay').classList.remove('show');
}

function openParent() {
  const stats = document.getElementById('parentStats');
  let html = '';
  KIDS.forEach(k => {
    const name = k === 'theo' ? 'Théodore' : 'Giulia';
    const tot = totalSuccessfulDays(k);
    const startDate = new Date(state[k].startDate);
    const daysSince = Math.floor((todayDate() - startDate)/(1000*60*60*24));
    const todayC = dayTaskCount(k, today());
    html += `<div class="row"><strong>${name}</strong><span>${todayC}/${TASKS.length} aujourd'hui · ${tot} jours ★ · ${daysSince}/180j</span></div>`;
  });
  if (state.simOffset) {
    html += `<div class="row" style="color:var(--gold)"><strong>⏩ Mode test</strong><span>+${state.simOffset} jours</span></div>`;
  }
  stats.innerHTML = html;
  document.getElementById('parentModal').classList.add('show');
}
function closeParent() {
  document.getElementById('parentModal').classList.remove('show');
}

function advanceDay(n) {
  state.simOffset = (state.simOffset || 0) + n;
  saveState();
  closeParent();
  if (currentKid) refreshAll();
  else refreshProfileScreen();
}
function resetSimDate() {
  state.simOffset = 0;
  saveState();
  closeParent();
  if (currentKid) refreshAll();
}

function resetAll() {
  if (!confirm('Tout effacer (historique, jours, semaines) ?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadState();
  saveState();
  closeParent();
  goBack();
}

refreshProfileScreen();
</script>
</body>
</html>
